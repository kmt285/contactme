<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin OS Control Panel</title>
    <style>
        :root { --os-bg: #008080; --win-bg: #c0c0c0; --win-border-light: #fff; --win-border-dark: #000; --win-title: #000080; }
        body { font-family: 'MS Sans Serif', Tahoma, sans-serif; background: var(--os-bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 800px; background: var(--win-bg); border-top: 2px solid var(--win-border-light); border-left: 2px solid var(--win-border-light); border-right: 2px solid var(--win-border-dark); border-bottom: 2px solid var(--win-border-dark); padding: 3px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .title-bar { background: var(--win-title); color: #fff; padding: 5px 8px; font-weight: bold; font-size: 14px; margin-bottom: 10px;}
        
        .tabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid #fff; margin-bottom: 10px; gap: 2px; }
        .tab { background: var(--win-bg); border: outset 2px; border-bottom: none; padding: 6px 15px; cursor: pointer; font-weight: bold; font-size: 13px;}
        .tab.active { background: #dfdfdf; border: inset 2px; border-bottom: none; padding-bottom: 8px; margin-bottom: -2px;}
        .tab-content { display: none; padding: 15px; background: #dfdfdf; border: inset 2px; min-height: 300px; }
        .tab-content.active { display: block; }
        
        input, textarea, select { width: 100%; box-sizing: border-box; padding: 6px; border: inset 2px; margin-bottom: 10px; outline: none; font-family: sans-serif; font-size:13px; }
        button { background: var(--win-bg); border: outset 2px; padding: 5px 10px; font-weight: bold; cursor: pointer; font-size: 13px;}
        button:active { border: inset 2px; }
        
        .msg-card { background: #fff; border: inset 2px; padding: 12px; margin-bottom: 12px; }
        
        /* Visual Editor Styles */
        .tree-node { background: #fff; border: 1px solid #888; padding: 8px; margin-bottom: 5px; font-size: 14px; box-shadow: 1px 1px 3px rgba(0,0,0,0.2);}
        .tree-children { margin-left: 20px; border-left: 2px dashed #888; padding-left: 10px; margin-top: 5px; }
        .btn-sm { padding: 2px 8px; font-size: 11px; font-weight: normal; }

        /* Modal */
        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; }
        .modal-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; background: var(--win-bg); border: outset 2px; box-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- Login Screen Overlay -->
    <div id="loginScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--os-bg); display:flex; justify-content:center; align-items:center; z-index:9999;">
        <div class="modal-box" style="position:relative; transform:none; top:0; left:0; width:300px;">
            <div class="title-bar">🔐 Admin Login</div>
            <div style="padding: 20px;">
                <input type="password" id="loginPass" placeholder="🔑 Enter Password" style="margin-bottom: 15px;">
                <button onclick="performLogin()" style="width: 100%;">Login</button>
                <p id="loginErr" style="color:red; font-size:13px; text-align:center; display:none; margin-top:10px; font-weight:bold;">Incorrect Password!</p>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Title bar တွင် Logout ခလုတ်ထည့်သွင်းခြင်း -->
        <div class="title-bar" style="display:flex; justify-content:space-between; align-items:center;">
            <span>⚙️ OS Control Panel</span>
            <button onclick="performLogout()" style="background:var(--win-bg); border:outset 2px; padding:2px 8px; font-size:11px; cursor:pointer;">Logout</button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('messages')">Messages</div>
            <div class="tab" onclick="switchTab('desktopGUI')">Desktop GUI</div>
            <div class="tab" onclick="switchTab('desktopCode')">JSON Code</div>
        </div>

        <!-- Messages Tab -->
        <div id="messages" class="tab-content active">
            <button onclick="fetchMessages()" style="width: 100%; margin-bottom: 15px;">Load Messages</button>
            <div id="messagesArea" style="font-size: 14px;"></div>
        </div>

        <!-- Desktop GUI Editor Tab -->
        <div id="desktopGUI" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <b style="font-size: 15px;">Visual Desktop Manager</b>
                <button onclick="saveGUIConfig()" style="background: var(--win-title); color: white;">Save Changes</button>
            </div>
            
            <div style="background: #fff; border: inset 2px; padding: 10px; margin-bottom: 15px;">
                <b>Background (Color or Image URL):</b>
                <input type="text" id="guiWallpaper" placeholder="e.g., #008080 or url('image.jpg')">
                <b>System Info (Start Menu):</b>
                <textarea id="guiSysInfo" rows="3" placeholder="Enter system info here..."></textarea>
            </div>

            <div style="margin-bottom: 10px;">
                <b style="font-size: 14px;">Desktop Files & Folders:</b>
                <button class="btn-sm" onclick="promptAddItem(guiConfig.items)" style="float: right;">+ Add Root Item</button>
            </div>
            <div style="clear: both; margin-bottom: 5px;"></div>
            
            <div id="guiTreeArea" style="background: #e0e0e0; border: inset 2px; padding: 10px; min-height: 150px;"></div>
        </div>

        <!-- Raw JSON Tab -->
        <div id="desktopCode" class="tab-content">
            <p style="font-size: 13px; font-weight: bold; margin-top:0;">Advanced JSON Editor</p>
            <textarea id="configEditor" rows="18"></textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="loadConfig()" style="flex: 1;">🔄 Reload</button>
                <button onclick="saveRawConfig()" style="flex: 1; background: var(--win-title); color: white;">💾 Save Code</button>
            </div>
        </div>
    </div>

    <!-- General Modal -->
    <div id="modalOverlay">
        <div class="modal-box">
            <div class="title-bar" id="modalTitle">System</div>
            <div style="padding: 15px;" id="modalBody"></div>
        </div>
    </div>

    <script>
        let guiConfig = { wallpaper: "#008080", systemInfo: "", items: [] };
        let activeArrayTarget = null; 
        let editItemTarget = null;

        // --- JWT Authentication Flow ---
        let adminToken = sessionStorage.getItem('authToken');
        
        // Page စဖွင့်ဖွင့်ချင်း Token ရှိမရှိ စစ်ဆေးခြင်း
        if(adminToken) {
            document.getElementById('loginScreen').style.display = 'none';
        }

        async function performLogin() {
            const pass = document.getElementById('loginPass').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                
                if(data.success) {
                    adminToken = data.token;
                    sessionStorage.setItem('authToken', adminToken);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('loginErr').style.display = 'none';
                    document.getElementById('loginPass').value = '';
                    fetchMessages(); // Login ဝင်တာနဲ့ Message တန်းဆွဲမည်
                } else {
                    document.getElementById('loginErr').style.display = 'block';
                }
            } catch(e) {
                alert("Network Error during login.");
            }
        }

        function performLogout() {
            sessionStorage.removeItem('authToken');
            adminToken = null;
            document.getElementById('loginScreen').style.display = 'flex';
        }

        // Token ကို API တိုင်းမှာ Header ကနေ ပို့ပေးမည့် Helper Function
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${adminToken}`
            };
        }

        // --- Data Fetching with JWT ---
        async function saveToServer() {
            try {
                const res = await fetch('/api/save-config', {
                    method: 'POST', 
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ configData: guiConfig }) // adminPassword ထည့်ပို့စရာမလိုတော့ပါ
                });
                if(res.ok) showMessage("Success", "Desktop Updated Successfully!");
                else {
                    if(res.status === 401 || res.status === 403) return performLogout(); // Token သက်တမ်းကုန်လျှင် Logout လုပ်မည်
                    showMessage("Error", "Failed to save.");
                }
            } catch (e) { showMessage("Error", "Network error."); }
        }

        async function fetchMessages() {
            const area = document.getElementById('messagesArea'); 
            area.innerHTML = "Loading...";
            try {
                // Method ကို POST အစား GET သို့ ပြောင်းထားသည်
                const res = await fetch('/api/get-messages', {
                    method: 'GET', 
                    headers: getAuthHeaders()
                });
                
                if(res.status === 401 || res.status === 403) return performLogout();
                
                const msgs = await res.json();
                if(msgs.length === 0) return area.innerHTML = "No new messages.";
                
                area.innerHTML = msgs.map(m => `
                    <div class="msg-card">
                        <button onclick="promptDeleteMsg('${m.id}')" style="float:right; color:#900; font-size:11px;">Delete</button>
                        <small style="color: #555;"><b>${new Date(m.date).toLocaleString()}</b></small>
                        <hr style="border:0; border-top:1px solid #ccc; margin:8px 0;">
                        <pre style="margin: 0; white-space: pre-wrap; word-break:break-word; font-family:sans-serif;">${m.content}</pre>
                    </div>
                `).join('');
            } catch(e) { area.innerHTML = ""; showMessage("Error", "Network connection failed."); }
        }

        async function deleteMsg(id) {
            await fetch('/api/delete', { 
                method: 'POST', 
                headers: getAuthHeaders(), 
                body: JSON.stringify({ id: id }) 
            });
            fetchMessages();
        }

        function showMessage(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `
                <div style="text-align:center; margin-bottom:15px; font-size:14px;">${msg}</div>
                <div style="text-align:center;"><button onclick="closeModal()">OK</button></div>
            `;
            document.getElementById('modalOverlay').style.display = 'block';
        }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function customConfirm(message, title, onConfirm) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `
                <div style="text-align:center; margin-bottom:15px; font-size:14px;">${message}</div>
                <div style="display: flex; gap: 10px;">
                    <button style="flex:1;" id="btnConfirmYes">Yes</button>
                    <button style="flex:1;" id="btnConfirmNo">No</button>
                </div>
            `;
            document.getElementById('modalOverlay').style.display = 'block';

            document.getElementById('btnConfirmYes').onclick = () => {
                closeModal();
                if(onConfirm) onConfirm();
            };
            document.getElementById('btnConfirmNo').onclick = closeModal;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if(tabId === 'desktopGUI') syncJSONtoGUI();
            if(tabId === 'desktopCode') syncGUItoJSON();
        }

        // GUI Builder Logic
        function renderTree(items, container, parentArray) {
            container.innerHTML = '';
            if(!items || items.length === 0) { container.innerHTML = "<i style='color:#666; font-size:12px;'>Empty</i>"; return; }
            
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'tree-node';
                
                let titleHtml = `<span>${item.icon} <b>${item.title}</b> <small style="color:#666;">(${item.type})</small></span>`;
                let controlsHtml = `
                    <div style="float: right;">
                        <button class="btn-sm" onclick="deleteItem(${index})">🗑️</button>
                    </div>
                `;
                div.innerHTML = titleHtml + controlsHtml;

                div.querySelector('button').onclick = () => {
                    customConfirm(`Delete "${item.title}"?`, "Confirm Delete", () => {
                        parentArray.splice(index, 1); 
                        refreshGUI();
                    });
                };

                if (item.type === 'folder') {
                    if(!item.children) item.children = [];
                    const childContainer = document.createElement('div');
                    childContainer.className = 'tree-children';
                    renderTree(item.children, childContainer, item.children);
                    
                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn-sm'; addBtn.innerText = "+ Add File inside " + item.title;
                    addBtn.style.marginTop = "5px";
                    addBtn.onclick = () => promptAddItem(item.children);
                    
                    childContainer.appendChild(addBtn);
                    div.appendChild(childContainer);
                }
                container.appendChild(div);
            });
        }

        function refreshGUI() {
            document.getElementById('guiWallpaper').value = guiConfig.wallpaper || '';
            document.getElementById('guiSysInfo').value = guiConfig.systemInfo || '';
            renderTree(guiConfig.items, document.getElementById('guiTreeArea'), guiConfig.items);
        }

        // Add New Item Modal
        function promptAddItem(targetArray) {
            activeArrayTarget = targetArray;
            document.getElementById('modalTitle').innerText = "Create New File/App";
            
            document.getElementById('modalBody').innerHTML = `
                <b>Type:</b>
                <select id="iType" onchange="toggleItemFields()">
                    <option value="text">📄 Text Document</option>
                    <option value="folder">📁 Folder</option>
                    <option value="link">🔗 Internet Link</option>
                    <option value="app">📧 Application (Contact Form)</option>
                </select>
                <b>Title:</b> <input type="text" id="iTitle" placeholder="e.g. My File.txt">
                <b>Icon (Emoji):</b> <input type="text" id="iIcon" value="📄">
                
                <div id="iContentDiv">
                    <b>Text Content:</b>
                    <textarea id="iContent" rows="4" placeholder="Write text here..."></textarea>
                </div>
                <div id="iLinkDiv" style="display:none;">
                    <b>Website URL:</b>
                    <input type="text" id="iUrl" placeholder="https://...">
                </div>
                
                <div style="display: flex; gap:10px; margin-top:10px;">
                    <button style="flex:1;" onclick="submitNewItem()">Create</button>
                    <button style="flex:1;" onclick="closeModal()">Cancel</button>
                </div>
            `;
            document.getElementById('modalOverlay').style.display = 'block';
        }

        function toggleItemFields() {
            const t = document.getElementById('iType').value;
            document.getElementById('iContentDiv').style.display = (t === 'text') ? 'block' : 'none';
            document.getElementById('iLinkDiv').style.display = (t === 'link') ? 'block' : 'none';
            
            const iconMap = { text: "📄", folder: "📁", link: "🔗", app: "📧" };
            document.getElementById('iIcon').value = iconMap[t];
            if(t === 'app') document.getElementById('iTitle').value = "Contact App";
        }

        function submitNewItem() {
            const type = document.getElementById('iType').value;
            let newItem = {
                id: "id_" + Math.random().toString(36).substr(2, 5),
                title: document.getElementById('iTitle').value || "New Item",
                icon: document.getElementById('iIcon').value || "📄",
                type: type
            };
            
            if(type === 'text') newItem.content = document.getElementById('iContent').value;
            if(type === 'link') newItem.url = document.getElementById('iUrl').value;
            if(type === 'folder') newItem.children = [];
            if(type === 'app') newItem.content = "contact_form";

            activeArrayTarget.push(newItem);
            closeModal(); refreshGUI();
        }

        // Config Syncing
        function syncJSONtoGUI() {
            try { guiConfig = JSON.parse(document.getElementById('configEditor').value); refreshGUI(); } 
            catch(e) { }
        }
        function syncGUItoJSON() {
            guiConfig.wallpaper = document.getElementById('guiWallpaper').value;
            guiConfig.systemInfo = document.getElementById('guiSysInfo').value;
            document.getElementById('configEditor').value = JSON.stringify(guiConfig, null, 4);
        }

        async function saveGUIConfig() { syncGUItoJSON(); await saveToServer(); }
        async function saveRawConfig() { syncJSONtoGUI(); await saveToServer(); }

        async function loadConfig() {
            const res = await fetch('/api/get-config');
            let data = await res.json();
            if(Array.isArray(data)) { data = { wallpaper: "#008080", systemInfo: "OS Version 1.0", items: data }; }
            document.getElementById('configEditor').value = JSON.stringify(data, null, 4);
            syncJSONtoGUI();
        }


        function promptDeleteMsg(id) {
            customConfirm("Are you sure you want to delete this message?", "Delete Message", () => {
                deleteMsg(id);
            });
        }


        loadConfig();
    </script>
</body>
</html>
