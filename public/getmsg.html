<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin OS Control Panel</title>
    <style>
        body { font-family: 'MS Sans Serif', Tahoma, sans-serif; background: #008080; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background: #c0c0c0; border: outset 2px; padding: 3px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .title-bar { background: #000080; color: #fff; padding: 4px 6px; font-weight: bold; font-size: 14px; margin-bottom: 10px;}
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #fff; margin-bottom: 10px; }
        .tab { background: #c0c0c0; border: outset 2px; border-bottom: none; padding: 5px 15px; cursor: pointer; font-weight: bold; margin-right: 2px; }
        .tab.active { background: #dfdfdf; border: inset 2px; border-bottom: none; }
        
        .tab-content { display: none; padding: 10px; background: #dfdfdf; border: inset 2px; min-height: 300px; }
        .tab-content.active { display: block; }
        
        input, textarea { width: 100%; box-sizing: border-box; padding: 6px; border: inset 2px; margin-bottom: 10px; outline: none; }
        button { background: #c0c0c0; border: outset 2px; padding: 6px 15px; font-weight: bold; cursor: pointer; }
        button:active { border: inset 2px; }
        
        .msg-card { background: #fff; border: inset 2px; padding: 10px; margin-bottom: 10px; }
        .del-btn { background: #c0c0c0; color: red; float: right; padding: 2px 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-bar">OS Control Panel</div>
        
        <!-- Login Area -->
        <div style="padding: 10px; background: #dfdfdf; border: inset 2px; margin-bottom: 10px;">
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('messages')">Messages</div>
            <div class="tab" onclick="switchTab('desktop')">Desktop Icons</div>
        </div>

        <!-- Messages Tab -->
        <div id="messages" class="tab-content active">
            <button onclick="fetchMessages()" style="width: 100%; margin-bottom: 10px;">Load Messages</button>
            <div id="messagesArea"></div>
        </div>

        <!-- Desktop Config Tab -->
        <div id="desktop" class="tab-content">
            <p style="font-size: 12px; font-weight: bold;">Edit Desktop Items (JSON Format)</p>
            <textarea id="configEditor" rows="15" style="font-family: monospace; font-size: 13px;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="loadConfig()" style="flex: 1;">Load Config</button>
                <button onclick="saveConfig()" style="flex: 1; background: #000080; color: white;">Save Config</button>
            </div>
            <p style="font-size: 11px; margin-top: 10px; color: #555;">* "type" can be: "app", "text", or "link".</p>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Fetch Messages
        async function fetchMessages() {
            const pass = document.getElementById('adminPass').value;
            const area = document.getElementById('messagesArea');
            area.innerHTML = "Loading...";
            
            const res = await fetch('/api/get-messages', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword: pass })
            });
            if(!res.ok) return area.innerHTML = "Wrong Password!";
            
            const msgs = await res.json();
            if(msgs.length === 0) return area.innerHTML = "No messages.";
            
            area.innerHTML = msgs.map(m => `
                <div class="msg-card">
                    <button class="del-btn" onclick="deleteMessage('${m.name}', '${m.sha}')">Delete</button>
                    <small><b>${m.name.replace('msg_','').replace('.txt','')}</b></small>
                    <pre style="margin: 5px 0 0; white-space: pre-wrap; word-break: break-all;">${m.content}</pre>
                </div>
            `).join('');
        }

        async function deleteMessage(filename, sha) {
            if(!confirm("Are you sure?")) return;
            const pass = document.getElementById('adminPass').value;
            await fetch('/api/delete', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword: pass, filename, sha })
            });
            fetchMessages();
        }

        // Load & Save Desktop Config
        async function loadConfig() {
            const res = await fetch('/api/get-config');
            const data = await res.json();
            document.getElementById('configEditor').value = JSON.stringify(data, null, 4);
        }

        async function saveConfig() {
            const pass = document.getElementById('adminPass').value;
            try {
                const configData = JSON.parse(document.getElementById('configEditor').value);
                const res = await fetch('/api/save-config', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword: pass, configData })
                });
                if(res.ok) alert("Desktop Updated Successfully!");
                else alert("Failed or Wrong Password.");
            } catch (e) {
                alert("Invalid JSON format! Please check your code.");
            }
        }
        
        // Auto load config on start
        loadConfig();
    </script>
</body>
</html>
