<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        /* Retro Windows 95 Style */
        body { font-family: 'MS Sans Serif', Tahoma, sans-serif; padding: 20px; background-color: #008080; }
        .container { max-width: 600px; margin: auto; background: #c0c0c0; border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #000; border-bottom: 2px solid #000; padding: 2px; }
        .title-bar { background: #000080; color: #fff; padding: 5px; font-weight: bold; margin-bottom: 10px;}
        .content { padding: 10px; }
        input { width: 100%; box-sizing: border-box; padding: 6px; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #fff; border-bottom: 2px solid #fff; outline: none; margin-bottom: 10px;}
        button { background: #c0c0c0; border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #000; border-bottom: 2px solid #000; padding: 6px 15px; font-weight: bold; cursor: pointer; outline: none; width: 100%;}
        button:active { border-top: 2px solid #000; border-left: 2px solid #000; border-right: 2px solid #fff; border-bottom: 2px solid #fff; }
        
        /* Message Card */
        .msg-card { background: #fff; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #fff; border-bottom: 2px solid #fff; padding: 10px; margin-top: 15px; }
        
        /* Small Red Delete Button */
        .del-btn { width: auto; background: #c0c0c0; color: #ff0000; float: right; padding: 2px 8px; font-size: 12px; margin-left: 10px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="title-bar">Secret Admin Dashboard</div>
        <div class="content">
            <input type="password" id="adminPass" placeholder="Enter your Secret Password">
            <button onclick="fetchMessages()">View Messages</button>
            <div id="messagesArea" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
    // (၁) Message များကို ဆွဲယူခြင်း
    async function fetchMessages() {
        const adminPass = document.getElementById('adminPass').value;
        document.getElementById('messagesArea').innerHTML = "Loading...";

        const res = await fetch('/api/get-messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminPassword: adminPass })
        });
        
        if(!res.ok) return document.getElementById('messagesArea').innerHTML = "<b style='color:maroon;'>Wrong Password!</b>";
        
        const messages = await res.json();
        if(messages.length === 0) return document.getElementById('messagesArea').innerHTML = "No messages yet.";

        let html = '';
        messages.forEach(msg => {
            // Delete ခလုတ်တွင် filename နှင့် sha ကို တွဲထည့်ထားမည်
            html += `<div class="msg-card">
                        <button class="del-btn" onclick="deleteMessage('${msg.name}', '${msg.sha}')">Delete</button>
                        <small style="color:gray;">${msg.name}</small>
                        <p style="font-size:16px; margin: 10px 0 0 0; font-family: 'Courier New', Courier, monospace;">${msg.content || "Error reading message"}</p>
                     </div>`;
        });
        document.getElementById('messagesArea').innerHTML = html;
    }

    // (၂) Message ကို ဖျက်ခြင်း
    async function deleteMessage(filename, sha) {
        // ဖျက်ရန် သေချာ/မသေချာ အတည်ပြုချက်တောင်းခြင်း
        if(!confirm("Are you sure you want to completely delete this message?")) return;

        const adminPass = document.getElementById('adminPass').value;
        
        const res = await fetch('/api/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminPassword: adminPass, filename: filename, sha: sha })
        });

        if(res.ok) {
            alert("Message deleted successfully!");
            fetchMessages(); // ဖျက်ပြီးပါက စာရင်းကို အလိုအလျောက် Refresh လုပ်မည်
        } else {
            alert("Failed to delete message.");
        }
    }
    </script>
</body>
</html>
