<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin OS Control Panel</title>
    <style>
        :root { --os-bg: #008080; --win-bg: #c0c0c0; --win-border-light: #fff; --win-border-dark: #000; --win-title: #000080; }
        body { font-family: 'MS Sans Serif', Tahoma, sans-serif; background: var(--os-bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 800px; background: var(--win-bg); border-top: 2px solid var(--win-border-light); border-left: 2px solid var(--win-border-light); border-right: 2px solid var(--win-border-dark); border-bottom: 2px solid var(--win-border-dark); padding: 3px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .title-bar { background: var(--win-title); color: #fff; padding: 5px 8px; font-weight: bold; font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between;}
        
        /* Tabs */
        .tabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid #fff; margin-bottom: 10px; gap: 2px; }
        .tab { background: var(--win-bg); border: outset 2px; border-bottom: none; padding: 6px 15px; cursor: pointer; font-weight: bold; font-size: 13px;}
        .tab.active { background: #dfdfdf; border: inset 2px; border-bottom: none; padding-bottom: 8px; margin-bottom: -2px;}
        
        .tab-content { display: none; padding: 15px; background: #dfdfdf; border: inset 2px; min-height: 300px; }
        .tab-content.active { display: block; }
        
        input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: inset 2px; margin-bottom: 10px; outline: none; font-family: monospace; }
        button { background: var(--win-bg); border: outset 2px; padding: 6px 15px; font-weight: bold; cursor: pointer; }
        button:active { border: inset 2px; }
        
        .msg-card { background: #fff; border: inset 2px; padding: 12px; margin-bottom: 12px; }
        .del-btn { background: var(--win-bg); color: #900; float: right; padding: 3px 10px; font-size: 12px; margin-left: 10px; }
        
        /* Custom Modal */
        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; }
        .modal-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: var(--win-bg); border: outset 2px; box-shadow: 3px 3px 6px rgba(0,0,0,0.5); }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            .tabs { flex-direction: column; border-bottom: none; }
            .tab { border-bottom: outset 2px; }
            .tab.active { border-bottom: inset 2px; margin-bottom: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-bar">
            <span>⚙️ OS Control Panel</span>
        </div>
        
        <div style="padding: 10px; background: #dfdfdf; border: inset 2px; margin-bottom: 15px; display: flex; gap: 10px;">
            <input type="password" id="adminPass" placeholder="🔑 Enter Admin Password" style="margin: 0; flex: 1;">
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('messages')">✉️ Messages</div>
            <div class="tab" onclick="switchTab('desktop')">🖥️ Desktop Icons</div>
        </div>

        <div id="messages" class="tab-content active">
            <button onclick="fetchMessages()" style="width: 100%; margin-bottom: 15px;">📥 Load Messages</button>
            <div id="messagesArea" style="font-size: 14px;"></div>
        </div>

        <div id="desktop" class="tab-content">
            <p style="font-size: 13px; font-weight: bold; margin-top:0;">Edit Desktop Items (JSON Format)</p>
            <textarea id="configEditor" rows="18" style="font-size: 13px;"></textarea>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="loadConfig()" style="flex: 1; min-width: 120px;">🔄 Reload Config</button>
                <button onclick="saveConfig()" style="flex: 1; background: var(--win-title); color: white; min-width: 120px;">💾 Save Config</button>
            </div>
            <p style="font-size: 12px; margin-top: 10px; color: #555;">* "type" can be: "app", "text", or "link".</p>
        </div>
    </div>

    <div id="modalOverlay">
        <div class="modal-box">
            <div class="title-bar" id="modalTitle">System</div>
            <div style="padding: 15px;">
                <div id="modalBody" style="margin-bottom: 15px; font-size: 14px; text-align: center;"></div>
                <div id="modalActions" style="display: flex; justify-content: center; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        // Modal Logic
        let confirmCallback = null;
        function showModal(title, msg, isConfirm = false, onConfirm = null) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = msg;
            const actions = document.getElementById('modalActions');
            
            if (isConfirm) {
                confirmCallback = onConfirm;
                actions.innerHTML = `
                    <button onclick="executeConfirm()">Yes</button>
                    <button onclick="closeModal()">No</button>
                `;
            } else {
                actions.innerHTML = `<button onclick="closeModal()">OK</button>`;
            }
            document.getElementById('modalOverlay').style.display = 'block';
        }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; confirmCallback = null; }
        function executeConfirm() { if(confirmCallback) confirmCallback(); closeModal(); }

        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Fetch Messages
        async function fetchMessages() {
            const pass = document.getElementById('adminPass').value;
            if(!pass) return showModal("Error", "Please enter Admin Password first.");
            
            const area = document.getElementById('messagesArea');
            area.innerHTML = "<i>Loading messages...</i>";
            
            try {
                const res = await fetch('/api/get-messages', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword: pass })
                });
                if(!res.ok) { area.innerHTML = ""; return showModal("Error", "Wrong Password or Server Error."); }
                
                const msgs = await res.json();
                if(msgs.length === 0) return area.innerHTML = "No new messages.";
                
                area.innerHTML = msgs.reverse().map(m => `
                    <div class="msg-card">
                        <button class="del-btn" onclick="promptDelete('${m.name}', '${m.sha}')">Delete</button>
                        <small style="color: #555;"><b>${m.name.replace('msg_','').replace('.txt','').replace(/-/g, ':')}</b></small>
                        <hr style="border: 0; border-top: 1px solid #ccc; margin: 8px 0;">
                        <pre style="margin: 0; white-space: pre-wrap; word-break: break-word; font-family: sans-serif;">${m.content}</pre>
                    </div>
                `).join('');
            } catch(e) { area.innerHTML = ""; showModal("Error", "Network connection failed."); }
        }

        function promptDelete(filename, sha) {
            showModal("Confirm Delete", `Are you sure you want to delete this message?`, true, async () => {
                const pass = document.getElementById('adminPass').value;
                const res = await fetch('/api/delete', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword: pass, filename, sha })
                });
                if(res.ok) { fetchMessages(); }
                else { showModal("Error", "Failed to delete message."); }
            });
        }

        // Config Management
        async function loadConfig() {
            const res = await fetch('/api/get-config');
            const data = await res.json();
            document.getElementById('configEditor').value = JSON.stringify(data, null, 4);
        }

        async function saveConfig() {
            const pass = document.getElementById('adminPass').value;
            if(!pass) return showModal("Error", "Please enter Admin Password first.");
            
            try {
                const configData = JSON.parse(document.getElementById('configEditor').value);
                const res = await fetch('/api/save-config', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword: pass, configData })
                });
                if(res.ok) showModal("Success", "Desktop Updated Successfully!");
                else showModal("Error", "Failed or Wrong Password.");
            } catch (e) {
                showModal("JSON Error", "Invalid JSON format! Please check your syntax.");
            }
        }
        
        loadConfig();
    </script>
</body>
</html>
