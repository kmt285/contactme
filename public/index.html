<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro OS Portfolio</title>
    <style>
        body { margin: 0; padding: 0; background-color: #008080; font-family: 'MS Sans Serif', Tahoma, sans-serif; overflow: hidden; user-select: none; }
        
        /* Desktop Icons */
        #desktop { padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; height: calc(100vh - 40px); }
        .desktop-icon { width: 80px; text-align: center; cursor: pointer; color: white; }
        .desktop-icon:active .icon-title { background: #000080; border: 1px dotted white; }
        .icon-img { font-size: 40px; display: block; margin-bottom: 5px; text-shadow: 1px 1px 2px black;}
        .icon-title { font-size: 13px; padding: 2px; }

        /* Taskbar */
        #taskbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 35px; background: #c0c0c0; border-top: 2px solid #fff; display: flex; align-items: center; padding: 0 5px; box-sizing: border-box; z-index: 10000; }
        .start-btn { font-weight: bold; padding: 4px 10px; border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #000; border-bottom: 2px solid #000; background: #c0c0c0; cursor: pointer; display: flex; align-items: center; gap: 5px;}
        .start-btn:active { border-top: 2px solid #000; border-left: 2px solid #000; border-right: 2px solid #fff; border-bottom: 2px solid #fff; }
        .clock { margin-left: auto; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #fff; border-bottom: 2px solid #fff; padding: 4px 10px; font-size: 13px; }

        /* Draggable Window */
        .window { position: absolute; background: #c0c0c0; border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #000; border-bottom: 2px solid #000; min-width: 300px; display: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); z-index: 100; }
        .title-bar { background: #000080; color: #fff; padding: 3px 5px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .close-btn { background: #c0c0c0; border-top: 2px solid #fff; border-left: 2px solid #fff; border-right: 2px solid #000; border-bottom: 2px solid #000; font-weight: bold; padding: 0 5px; cursor: pointer; }
        .close-btn:active { border: inset 2px; }
        .window-content { padding: 15px; font-size: 14px; background: #fff; margin: 5px; border: inset 2px; min-height: 100px;}
        
        /* Contact Form Styles inside Window */
        input[type="text"], textarea { width: 100%; box-sizing: border-box; background: #fff; border: inset 2px; padding: 6px; font-family: monospace; font-size: 14px; margin-bottom: 10px; outline: none;}
        button.action-btn { background: #c0c0c0; border: outset 2px; padding: 6px 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px;}
        button.action-btn:active { border: inset 2px; }
    </style>
</head>
<body>

    <!-- Desktop Area (Icons will be injected here) -->
    <div id="desktop"></div>

    <!-- Generic Window Template -->
    <div id="appWindow" class="window" style="top: 100px; left: 100px;">
        <div class="title-bar" id="appWindowHeader">
            <span id="winTitle">Window</span>
            <button class="close-btn" onclick="closeWindow()">X</button>
        </div>
        <div class="window-content" id="winContent"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="start-btn" onclick="alert('Start Menu coming soon!')">🪟 Start</div>
        <div class="clock" id="clock">12:00 PM</div>
    </div>

    <script>
        // Clock Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // Fetch Desktop Config from GitHub
        async function loadDesktop() {
            const res = await fetch('/api/get-config');
            const items = await res.json();
            const desktop = document.getElementById('desktop');
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'desktop-icon';
                div.innerHTML = `<span class="icon-img">${item.icon}</span><span class="icon-title">${item.title}</span>`;
                
                div.ondblclick = () => openItem(item);
                // Touch support for mobile
                let lastTap = 0;
                div.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 500 && tapLength > 0) { openItem(item); e.preventDefault(); }
                    lastTap = currentTime;
                });
                
                desktop.appendChild(div);
            });
        }

        // Open App or File
        function openItem(item) {
            const win = document.getElementById('appWindow');
            document.getElementById('winTitle').innerText = item.title;
            const contentArea = document.getElementById('winContent');

            if(item.type === 'link') {
                window.open(item.url, '_blank');
                return;
            } else if(item.type === 'text') {
                contentArea.innerHTML = `<pre style="white-space: pre-wrap; font-family: 'MS Sans Serif', sans-serif;">${item.content}</pre>`;
            } else if(item.type === 'app' && item.content === 'contact_form') {
                contentArea.innerHTML = `
                    <b>Name:</b><input type="text" id="sName" placeholder="Optional">
                    <b>Contact:</b><input type="text" id="sContact" placeholder="Email/Phone">
                    <b>Message:</b><textarea id="sMsg" rows="5"></textarea>
                    <button class="action-btn" id="sBtn" onclick="sendMsg()">Send Message</button>
                    <p id="sStatus" style="color: green; font-weight:bold; display:none; text-align:center; margin-bottom:0;">Sent Successfully!</p>
                `;
            }
            win.style.display = 'block';
        }

        function closeWindow() { document.getElementById('appWindow').style.display = 'none'; }

        // Send Message Function
        async function sendMsg() {
            const btn = document.getElementById('sBtn');
            const msg = document.getElementById('sMsg').value;
            if(!msg.trim()) return alert("Write a message first!");
            
            btn.innerText = "Sending..."; btn.disabled = true;
            try {
                const res = await fetch('/api/send', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('sName').value,
                        contact: document.getElementById('sContact').value,
                        message: msg
                    })
                });
                if(res.ok) {
                    document.getElementById('sStatus').style.display = 'block';
                    document.getElementById('sMsg').value = '';
                    setTimeout(() => document.getElementById('sStatus').style.display = 'none', 3000);
                }
            } catch(e) { alert("Failed to send."); }
            btn.innerText = "Send Message"; btn.disabled = false;
        }

        // Draggable Window Logic
        dragElement(document.getElementById("appWindow"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            document.getElementById("appWindowHeader").onmousedown = dragMouseDown;
            function dragMouseDown(e) {
                e = e || window.event; e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e = e || window.event; e.preventDefault();
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
        }

        loadDesktop();
    </script>
</body>
</html>
