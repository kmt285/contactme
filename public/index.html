<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Contact</title>
    <style>
        /* Retro Windows 95/98 Style CSS */
        body { background-color: #008080; font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .window { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080; padding: 2px; }
        .main-window { width: 90%; max-width: 450px; }
        .title-bar { background-color: #000080; color: #ffffff; padding: 3px 5px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .window-content { padding: 15px; }
        
        /* Inputs and Textarea Style */
        input[type="text"], textarea { width: 100%; box-sizing: border-box; background-color: #ffffff; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; padding: 8px; font-family: 'Courier New', Courier, monospace; font-size: 14px; outline: none; margin-bottom: 10px; }
        textarea { resize: none; margin-bottom: 0; }
        .field-label { font-size: 13px; margin-bottom: 4px; display: block; font-weight: bold;}
        
        button { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; padding: 6px 15px; font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; outline: none; }
        button:active { border-top: 2px solid #000000; border-left: 2px solid #000000; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; padding: 7px 14px 5px 16px; }
        
        /* Custom Alert Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .alert-window { width: 80%; max-width: 300px; }
        .alert-content { text-align: center; padding: 20px; }
        .alert-text { margin: 0 0 15px 0; font-size: 14px; }
        .close-btn { width: auto; margin: 0; padding: 0 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="window main-window">
        <div class="title-bar">
            <span>Contact Messenger</span>
        </div>
        <div class="window-content">
            <span class="field-label">Name:</span>
            <input type="text" id="senderName" placeholder="Optional">
            
            <span class="field-label">Contact (Email/Phone):</span>
            <input type="text" id="senderContact" placeholder="Optional">

            <span class="field-label" style="margin-top: 5px;">Message:</span>
            <textarea id="msgBox" rows="6" placeholder="Type your message here..."></textarea>
            
            <button id="sendBtn" onclick="sendMessage()">Send Message</button>
        </div>
    </div>

    <!-- Custom Alert Box -->
    <div id="customAlert" class="modal-overlay">
        <div class="window alert-window">
            <div class="title-bar">
                <span id="alertTitle">System Message</span>
                <button class="close-btn" onclick="closeAlert()">X</button>
            </div>
            <div class="window-content alert-content">
                <p id="alertText" class="alert-text"></p>
                <button onclick="closeAlert()">OK</button>
            </div>
        </div>
    </div>

    <script>
    function showAlert(title, message) {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertText').innerText = message;
        document.getElementById('customAlert').style.display = 'flex';
    }

    function closeAlert() {
        document.getElementById('customAlert').style.display = 'none';
    }

    async function sendMessage() {
        // Data များကို ရယူခြင်း
        const name = document.getElementById('senderName').value;
        const contact = document.getElementById('senderContact').value;
        const msg = document.getElementById('msgBox').value;
        const btn = document.getElementById('sendBtn');

        if(!msg.trim()) {
            return showAlert("Error", "Please write a message first.");
        }
        
        btn.innerText = "Sending...";
        btn.disabled = true;
        
        try {
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, contact: contact, message: msg }) // အချက်အလက် (၃) ခု ပို့မည်
            });

            if(res.ok) {
                showAlert("Success", "Message sent securely!");
                document.getElementById('senderName').value = '';
                document.getElementById('senderContact').value = '';
                document.getElementById('msgBox').value = '';
            } else {
                showAlert("Error", "Failed to send message.");
            }
        } catch (error) {
            showAlert("Error", "Network connection failed.");
        }

        btn.innerText = "Send Message";
        btn.disabled = false;
    }
    </script>
</body>
</html>
