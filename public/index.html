<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro OS Portfolio</title>
    <style>
        :root { --os-bg: #008080; --win-bg: #c0c0c0; --win-border-light: #fff; --win-border-dark: #000; --win-title: #000080; }
        body { margin: 0; padding: 0; background-color: var(--os-bg); font-family: 'MS Sans Serif', Tahoma, sans-serif; overflow: hidden; user-select: none; }
        
        /* Desktop Icons */
        #desktop { padding: 0; position: relative; width: 100%; height: calc(100vh - 35px); overflow: hidden; }
        .desktop-icon { width: 80px; text-align: center; cursor: pointer; color: white; display: flex; flex-direction: column; align-items: center; position: absolute; user-select: none; }
        .desktop-icon:active .icon-title { background: var(--win-title); border: 1px dotted white; }
        .icon-img { font-size: 40px; display: block; margin-bottom: 5px; text-shadow: 2px 2px 3px rgba(0,0,0,0.7); pointer-events: none; }
        .icon-title { font-size: 13px; padding: 2px 4px; display: inline-block; word-break: break-word; pointer-events: none; }

        /* Taskbar & Start Menu */
        #taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 35px; background: var(--win-bg); border-top: 2px solid var(--win-border-light); display: flex; align-items: center; padding: 0 5px; box-sizing: border-box; z-index: 100000; }
        .start-btn { font-weight: bold; padding: 4px 10px; border-top: 2px solid var(--win-border-light); border-left: 2px solid var(--win-border-light); border-right: 2px solid var(--win-border-dark); border-bottom: 2px solid var(--win-border-dark); background: var(--win-bg); cursor: pointer; display: flex; align-items: center; gap: 5px;}
        .start-btn:active, .start-btn.active { border-top: 2px solid var(--win-border-dark); border-left: 2px solid var(--win-border-dark); border-right: 2px solid var(--win-border-light); border-bottom: 2px solid var(--win-border-light); }
        .clock { margin-left: auto; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid var(--win-border-light); border-bottom: 2px solid var(--win-border-light); padding: 4px 10px; font-size: 13px; }

        /* Taskbar Items */
        #taskbarItems { display: flex; gap: 4px; flex: 1; overflow-x: hidden; margin-left: 10px; }
        .taskbar-item { padding: 3px 8px; border: outset 2px; background: var(--win-bg); cursor: pointer; white-space: nowrap; font-size: 13px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .taskbar-item.active { border: inset 2px; background: #dfdfdf; font-weight: bold; }

        #startMenu { display: none; position: absolute; bottom: 35px; left: 0; width: 200px; background: var(--win-bg); border-top: 2px solid var(--win-border-light); border-left: 2px solid var(--win-border-light); border-right: 2px solid var(--win-border-dark); border-bottom: 2px solid var(--win-border-dark); z-index: 99999; box-shadow: 3px 3px 5px rgba(0,0,0,0.5); }
        .start-item { padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: black; }
        .start-item:hover { background: var(--win-title); color: white; }

        /* Context Menu Styles */
        #contextMenu { position: absolute; background: var(--win-bg); border-top: 2px solid var(--win-border-light); border-left: 2px solid var(--win-border-light); border-right: 2px solid var(--win-border-dark); border-bottom: 2px solid var(--win-border-dark); box-shadow: 3px 3px 5px rgba(0,0,0,0.5); z-index: 999999; display: none; flex-direction: column; min-width: 150px; padding: 2px; }
        .ctx-item { padding: 5px 15px; cursor: pointer; font-size: 13px; color: black; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
        .ctx-item:hover { background: var(--win-title); color: white; }
        .ctx-divider { height: 0; border-top: 1px solid #808080; border-bottom: 1px solid #fff; margin: 3px 2px; }

        /* Draggable & Resizable Window */
        .window { position: absolute; background: var(--win-bg); border-top: 2px solid var(--win-border-light); border-left: 2px solid var(--win-border-light); border-right: 2px solid var(--win-border-dark); border-bottom: 2px solid var(--win-border-dark); width: 450px; min-width: 250px; min-height: 200px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); display: none; flex-direction: column; }
        .title-bar { background: var(--win-title); color: #fff; padding: 4px 6px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; }
        
        /* Window Controls & Maximized State */
        .window-controls { display: flex; gap: 3px; align-items: center; }
        .win-btn { 
            background: var(--win-bg); 
            border-top: 2px solid var(--win-border-light); 
            border-left: 2px solid var(--win-border-light); 
            border-right: 2px solid var(--win-border-dark); 
            border-bottom: 2px solid var(--win-border-dark); 
            cursor: pointer; width: 22px; height: 22px; 
            padding: 0; margin: 0; position: relative; box-sizing: border-box; 
        }
        .win-btn:active { 
            border-top: 2px solid var(--win-border-dark); border-left: 2px solid var(--win-border-dark); 
            border-right: 2px solid var(--win-border-light); border-bottom: 2px solid var(--win-border-light); 
        }
        
        .win-btn.min::before { content: ''; position: absolute; top: 50%; left: 50%; width: 10px; height: 2px; background: #000; transform: translate(-50%, -50%); }
        .win-btn.min:active::before { transform: translate(calc(-50% + 1px), calc(-50% + 1px)); }
        
        .win-btn.max::before { content: ''; position: absolute; top: 4px; left: 4px; width: 10px; height: 9px; border: 1px solid #000; border-top: 2px solid #000; box-sizing: border-box; }
        .win-btn.max:active::before { top: 5px; left: 5px; }
        
        .window.maximized .win-btn.max::before { width: 8px; height: 7px; top: 6px; left: 4px; }
        .window.maximized .win-btn.max::after { content: ''; position: absolute; width: 8px; height: 7px; border: 1px solid #000; border-top: 2px solid #000; top: 3px; left: 7px; box-sizing: border-box; }
        
        .win-btn.close::before, .win-btn.close::after { content: ''; position: absolute; top: 50%; left: 50%; width: 11px; height: 1.5px; background: #000; }
        .win-btn.close::before { transform: translate(-50%, -50%) rotate(45deg); }
        .win-btn.close::after { transform: translate(-50%, -50%) rotate(-45deg); }

        .window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100vh - 35px) !important; transform: none !important; }
        .window-content { padding: 0; font-size: 14px; background: var(--win-bg); flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

        /* Window Resizer Handles */
        .resizer { position: absolute; z-index: 10; }
        .resizer-r { right: -3px; top: 0; width: 6px; height: 100%; cursor: e-resize; }
        .resizer-l { left: -3px; top: 0; width: 6px; height: 100%; cursor: w-resize; }
        .resizer-b { bottom: -3px; left: 0; width: 100%; height: 6px; cursor: s-resize; }
        .resizer-t { top: -3px; left: 0; width: 100%; height: 6px; cursor: n-resize; }
        .resizer-br { right: -3px; bottom: -3px; width: 10px; height: 10px; cursor: se-resize; }
        .resizer-bl { left: -3px; bottom: -3px; width: 10px; height: 10px; cursor: sw-resize; }
        .resizer-tr { right: -3px; top: -3px; width: 10px; height: 10px; cursor: ne-resize; }
        .resizer-tl { left: -3px; top: -3px; width: 10px; height: 10px; cursor: nw-resize; }
        
        /* Inside Folder Icons */
        .folder-grid { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .folder-grid .folder-icon { color: black; width: 70px; margin: 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .folder-grid .folder-icon .icon-img { text-shadow: none; font-size: 35px; display: block; margin-bottom: 5px; }
        .folder-grid .folder-icon .icon-title { font-size: 13px; padding: 2px 4px; word-break: break-word; }
        .folder-grid .folder-icon:active .icon-title { background: var(--win-title); color: white; border: 1px dotted black; }
        
        /* Forms */
        input[type="text"], textarea { width: 100%; box-sizing: border-box; background: #fff; border: inset 2px; padding: 6px; font-family: monospace; font-size: 14px; margin-bottom: 10px; outline: none;}
        button.action-btn { background: var(--win-bg); border: outset 2px; padding: 6px 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px;}
        button.action-btn:active { border: inset 2px; }

        /* Custom Alert Modal */
        #customAlertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 1000000; }
        #customAlert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; display: block; z-index: 1000001; }
        
        @media (max-width: 500px) {
            .window { width: 90% !important; left: 5% !important; top: 10% !important; transform: none !important; }
            #customAlert { width: 85% !important; }
            #desktop { gap: 15px; }
        }
    </style>
    <script>
        try {
            const cachedBg = localStorage.getItem('os_wallpaper');
            if (cachedBg) {
                let bgVal = cachedBg;
                if ((bgVal.startsWith('http') || bgVal.includes('.jpg') || bgVal.includes('.png')) && !bgVal.startsWith('url(')) {
                    bgVal = `url('${bgVal}')`;
                }
                const style = document.createElement('style');
                if (bgVal.startsWith('url')) {
                    style.textContent = `body { background-image: ${bgVal} !important; background-size: cover !important; background-position: center !important; }`;
                } else {
                    style.textContent = `body { background: ${bgVal} !important; }`;
                }
                document.head.appendChild(style);
            }
        } catch(e) {}
    </script>
</head>
<body>

    <div id="contextMenu"></div>
    <div id="desktop"></div>

    <div id="startMenu">
        <div class="start-item" onclick="customAlert(osConfig.systemInfo || 'System is running smoothly.', 'System Info'); toggleStart();">ℹ️ System Info</div>
        <div class="start-item" onclick="window.location.reload();">🔄 Restart</div>
    </div>

    <div id="taskbar">
        <div class="start-btn" id="startBtn" onclick="toggleStart()">🪟 Start</div>
        <div id="taskbarItems"></div>
        <div class="clock" id="clock">12:00 PM</div>
    </div>

    <div id="customAlertOverlay">
        <div id="customAlert" class="window" style="min-height: auto; height: auto; width: 300px;">
            <div class="title-bar">
                <span id="alertTitle">Message</span>
                <button class="win-btn close" onclick="closeAlert()"></button>
            </div>
            <div style="padding: 20px; background: var(--win-bg); display: block;">
                <div id="alertMsg" style="margin-bottom: 25px; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 14px; white-space: pre-wrap; line-height: 1.5;"></div>
                <div style="text-align: center;">
                    <button class="action-btn" style="width: auto; min-width: 80px; padding: 4px 20px; margin: 0;" onclick="closeAlert()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);

        function customAlert(message, title = "System Message") {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerHTML = `<span></span> <div>${message}</div>`;
            document.getElementById('customAlertOverlay').style.display = 'block';
        }
        function closeAlert() { document.getElementById('customAlertOverlay').style.display = 'none'; }

        function toggleStart() {
            const menu = document.getElementById('startMenu');
            const btn = document.getElementById('startBtn');
            const isBlock = menu.style.display === 'block';
            menu.style.display = isBlock ? 'none' : 'block';
            isBlock ? btn.classList.remove('active') : btn.classList.add('active');
        }

        document.addEventListener('click', (e) => {
            if(!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) {
                document.getElementById('startMenu').style.display = 'none';
                document.getElementById('startBtn').classList.remove('active');
            }
        });

        let osConfig = {}; 
        let globalZIndex = 100; 
        let windowOffset = 0;   

        function applyBackground(bgVal) {
            bgVal = bgVal || '#008080';
            if ((bgVal.startsWith('http') || bgVal.includes('.jpg') || bgVal.includes('.png')) && !bgVal.startsWith('url(')) {
                bgVal = `url('${bgVal}')`;
            }
            if (bgVal.startsWith('url')) {
                document.body.style.backgroundImage = bgVal;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            } else {
                document.body.style.background = bgVal;
                document.body.style.backgroundImage = 'none';
            }
        }

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
            const ctx = document.getElementById('contextMenu');
            ctx.innerHTML = ''; 

            let menuItems = osConfig.contextMenu || [
                { label: "🔄 Refresh", action: "refresh" },
                { type: "divider" },
                { label: "🔲 Auto Arrange Icons", action: "auto_arrange" },
                { type: "divider" },
                { label: "ℹ️ System Info", action: "sysinfo" }
            ];

            menuItems.forEach(item => {
                if(item.type === 'divider') {
                    const div = document.createElement('div');
                    div.className = 'ctx-divider';
                    ctx.appendChild(div);
                } else {
                    const div = document.createElement('div');
                    div.className = 'ctx-item';
                    div.innerHTML = item.label;
                    div.onclick = () => {
                        // Action သို့မဟုတ် URL ကို တိကျစွာ ခွဲခြားစစ်ဆေးခြင်း
                        if (item.action === 'refresh') {
                            window.location.reload();
                        } else if (item.action === 'sysinfo') {
                            customAlert(osConfig.systemInfo || 'System is running smoothly.', 'System Info');
                        } else if (item.action === 'auto_arrange' || (item.url && item.url.includes('auto_arrange'))) {
                            localStorage.removeItem('icon_positions_desktop');
                            localStorage.removeItem('icon_positions');
                            window.location.reload();
                        } else if (item.url) {
                            window.open(item.url, '_blank');
                        }
                    };
                    ctx.appendChild(div);
                }
            });

            ctx.style.display = 'flex';
            let x = e.clientX; let y = e.clientY;
            if (x + ctx.offsetWidth > window.innerWidth) x -= ctx.offsetWidth;
            if (y + ctx.offsetHeight > window.innerHeight) y -= ctx.offsetHeight;
            ctx.style.left = x + 'px';
            ctx.style.top = y + 'px';
        });
        
        document.addEventListener('click', (e) => {
            if(e.button !== 2) document.getElementById('contextMenu').style.display = 'none';
        });

        async function loadDesktop() {
            const cachedConfigStr = localStorage.getItem('os_config_cache');
            if (cachedConfigStr) {
                try {
                    osConfig = JSON.parse(cachedConfigStr);
                    applyBackground(osConfig.wallpaper);
                    renderDesktopItems(osConfig.items, document.getElementById('desktop'));
                } catch(e) {}
            }

            try {
                const res = await fetch('/api/get-config');
                let freshData = await res.json();
                if(Array.isArray(freshData)) { 
                    freshData = { wallpaper: "#008080", systemInfo: "OS Version 1.0", items: freshData }; 
                }

                if (JSON.stringify(freshData) !== cachedConfigStr) {
                    osConfig = freshData;
                    localStorage.setItem('os_config_cache', JSON.stringify(osConfig));
                    localStorage.setItem('os_wallpaper', osConfig.wallpaper || '#008080');
                    applyBackground(osConfig.wallpaper);
                    renderDesktopItems(osConfig.items, document.getElementById('desktop'));
                }
            } catch(e) {}
        }

        function renderDesktopItems(itemsArray, container) {
            container.innerHTML = ''; 
            let positions = JSON.parse(localStorage.getItem('icon_positions_desktop') || '{}');
            let defaultTop = 20;
            let defaultLeft = 20;

            (itemsArray || []).forEach(item => {
                const div = document.createElement('div');
                div.className = 'desktop-icon';
                div.innerHTML = `<span class="icon-img">${item.icon}</span><span class="icon-title">${item.title}</span>`;
                
                if (positions[item.id]) {
                    div.style.top = positions[item.id].top;
                    div.style.left = positions[item.id].left;
                } else {
                    div.style.top = defaultTop + 'px';
                    div.style.left = defaultLeft + 'px';
                    defaultTop += 100;
                    if (defaultTop > window.innerHeight - 150) {
                        defaultTop = 20;
                        defaultLeft += 100;
                    }
                }

                makeIconDraggable(div, item.id, 'icon_positions_desktop');
                
                div.ondblclick = () => {
                    if (div.dataset.dragging !== "true") openItem(item);
                };
                
                let lastTap = 0;
                div.addEventListener('touchend', (e) => {
                    if (div.dataset.dragging === "true") return;
                    const ct = new Date().getTime();
                    if (ct - lastTap < 500 && ct - lastTap > 0) { openItem(item); e.preventDefault(); }
                    lastTap = ct;
                });
                
                container.appendChild(div);
            });
        }

        function makeIconDraggable(elmnt, itemId, storageKey = 'icon_positions_desktop') {
            let p1=0, p2=0, p3=0, p4=0;
            let isDragging = false;
            let startX, startY;

            elmnt.onmousedown = dragStart;
            elmnt.ontouchstart = dragStart;

            function dragStart(e) {
                isDragging = false;
                elmnt.dataset.dragging = "false"; 
                if (e.type === "touchstart") { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; } 
                else { p3 = e.clientX; p4 = e.clientY; }
                startX = p3; startY = p4;

                document.onmouseup = dragEnd; document.onmousemove = dragMove;
                document.ontouchend = dragEnd; document.ontouchmove = dragMove;
            }

            function dragMove(e) {
                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                if (!isDragging && (Math.abs(clientX - startX) > 5 || Math.abs(clientY - startY) > 5)) {
                    isDragging = true;
                    elmnt.dataset.dragging = "true";
                    elmnt.style.zIndex = 1000;
                }

                if (isDragging) {
                    e.preventDefault();
                    p1 = p3 - clientX; p2 = p4 - clientY;
                    p3 = clientX; p4 = clientY;
                    
                    let newTop = elmnt.offsetTop - p2;
                    let newLeft = elmnt.offsetLeft - p1;

                    const taskbarHeight = 35;
                    const maxTop = window.innerHeight - elmnt.offsetHeight - taskbarHeight;
                    const maxLeft = window.innerWidth - elmnt.offsetWidth;

                    if (newTop < 0) newTop = 0;
                    if (newLeft < 0) newLeft = 0;
                    if (newTop > maxTop) newTop = maxTop;
                    if (newLeft > maxLeft) newLeft = maxLeft;

                    elmnt.style.top = newTop + "px";
                    elmnt.style.left = newLeft + "px";
                }
            }

            function dragEnd() {
                document.onmouseup = null; document.onmousemove = null;
                document.ontouchend = null; document.ontouchmove = null;

                if (isDragging) {
                    elmnt.style.zIndex = ""; 

                    let currentTop = parseInt(elmnt.style.top);
                    let currentLeft = parseInt(elmnt.style.left);
                    
                    let snappedTop = Math.round((currentTop - 20) / 100) * 100 + 20;
                    let snappedLeft = Math.round((currentLeft - 20) / 100) * 100 + 20;

                    const taskbarHeight = 35;
                    const maxTop = window.innerHeight - elmnt.offsetHeight - taskbarHeight;
                    const maxLeft = window.innerWidth - elmnt.offsetWidth;
                    
                    if (snappedTop < 20) snappedTop = 20;
                    if (snappedLeft < 20) snappedLeft = 20;
                    if (snappedTop > maxTop) snappedTop = Math.max(20, Math.floor((maxTop - 20) / 100) * 100 + 20);
                    if (snappedLeft > maxLeft) snappedLeft = Math.max(20, Math.floor((maxLeft - 20) / 100) * 100 + 20);

                    elmnt.style.top = snappedTop + "px";
                    elmnt.style.left = snappedLeft + "px";

                    setTimeout(() => { elmnt.dataset.dragging = "false"; }, 100); 
                    
                    let positions = JSON.parse(localStorage.getItem(storageKey) || '{}');
                    positions[itemId] = { top: elmnt.style.top, left: elmnt.style.left };
                    localStorage.setItem(storageKey, JSON.stringify(positions));
                }
            }
        }

        function openItem(item) {
            const winId = 'win_' + Math.random().toString(36).substr(2, 9);
            const win = document.createElement('div');
            win.className = 'window';
            win.id = winId;
            
            if(item.type === 'folder') win.folderHistory = [item];

            let offsetXY = (windowOffset % 10) * 20;
            win.style.top = (50 + offsetXY) + 'px';
            win.style.left = (50 + offsetXY) + 'px';
            windowOffset++;
            
            win.onmousedown = () => focusWindow(winId);
            win.ontouchstart = () => focusWindow(winId);

            win.innerHTML = `
                <div class="title-bar" id="header_${winId}">
                    <span id="title_${winId}">${item.icon} ${item.title}</span>
                    <div class="window-controls">
                        <button class="win-btn min" onclick="minimizeWindow('${winId}'); event.stopPropagation();"></button>
                        <button class="win-btn max" id="maxBtn_${winId}" onclick="maximizeWindow('${winId}'); event.stopPropagation();"></button>
                        <button class="win-btn close" onclick="closeWindow('${winId}'); event.stopPropagation();"></button>
                    </div>
                </div>
                <div style="background: #fff; padding: 5px 8px; display:none; border-bottom: inset 2px; font-size:13px; font-family: sans-serif;" id="toolbar_${winId}">
                </div>
                <div class="window-content" id="content_${winId}"></div>
            `;

            document.body.appendChild(win);

            const tbItem = document.createElement('div');
            tbItem.className = 'taskbar-item';
            tbItem.id = `tb_${winId}`;
            tbItem.innerHTML = `<span style="font-size:12px;">${item.icon}</span> <span style="overflow:hidden; text-overflow:ellipsis;">${item.title}</span>`;
            tbItem.onclick = () => toggleWindow(winId);
            document.getElementById('taskbarItems').appendChild(tbItem);

            renderWindowContent(winId, item);
            dragElement(win, document.getElementById(`header_${winId}`));
            makeResizable(win);
            focusWindow(winId);
        }

        function renderWindowContent(winId, item) {
            const contentArea = document.getElementById(`content_${winId}`);
            const titleArea = document.getElementById(`title_${winId}`);
            const tbItem = document.getElementById(`tb_${winId}`);
            
            titleArea.innerHTML = `${item.icon} ${item.title}`;
            if(tbItem) tbItem.innerHTML = `<span style="font-size:12px;">${item.icon}</span> <span style="overflow:hidden; text-overflow:ellipsis;">${item.title}</span>`;

            if(item.type === 'text') {
                contentArea.innerHTML = `
                    <div style="background: #fff; border: inset 2px; padding: 20px; margin: 8px; min-height: 200px; box-sizing: border-box; font-family: 'MS Sans Serif', sans-serif; line-height: 1.5; word-wrap: break-word;">
                        ${item.content || ''}
                    </div>`;
                
            } else if(item.type === 'app' && item.content === 'contact_form') {
                contentArea.innerHTML = `
                    <div style="background: #fff; border: inset 2px; padding: 15px; margin: 8px; flex: 1; display: flex; flex-direction: column; box-sizing: border-box;">
                        <div style="margin-bottom: 5px; font-weight: bold;">Name:</div>
                        <input type="text" id="sName_${winId}" placeholder="Optional">
                        
                        <div style="margin-bottom: 5px; font-weight: bold;">Contact:</div>
                        <input type="text" id="sContact_${winId}" placeholder="Email or Phone">
                        
                        <div style="margin-bottom: 5px; font-weight: bold;">Message:</div>
                        <textarea id="sMsg_${winId}" rows="5" style="resize: vertical; flex: 1; min-height: 80px;"></textarea>
                        
                        <button class="action-btn" id="sBtn_${winId}" onclick="sendMsg('${winId}')" style="margin-top: 10px;">Send Message</button>
                        <p id="sStatus_${winId}" style="color: #000080; font-weight:bold; display:none; text-align:center; margin-bottom:0; margin-top:10px; background:#dfdfdf; padding:5px; border:inset 2px;">Sent Successfully!</p>
                    </div>
                `;
                
            } else if(item.type === 'folder') {
                contentArea.innerHTML = `<div id="folderContainer_${winId}" class="folder-grid" style="padding: 10px;"></div>`;
                renderFolderItems(item.children || [], document.getElementById(`folderContainer_${winId}`), winId);
                
                const winNode = document.getElementById(winId);
                const toolbar = document.getElementById(`toolbar_${winId}`);
                if(toolbar && winNode.folderHistory) {
                    toolbar.style.display = 'block';
                    let pathHtml = '';
                    winNode.folderHistory.forEach((histItem, idx) => {
                        if (idx > 0) pathHtml += ' <span style="color:#888; font-size:11px; margin: 0 4px;">▶</span> ';
                        if (idx === winNode.folderHistory.length - 1) {
                            pathHtml += `<span style="font-weight:bold; color:black;">${histItem.title}</span>`;
                        } else {
                            pathHtml += `<span style="cursor:pointer; color:var(--win-title);" 
                                onmouseover="this.style.textDecoration='underline'" 
                                onmouseout="this.style.textDecoration='none'" 
                                onclick="jumpToHistory('${winId}', ${idx})">${histItem.title}</span>`;
                        }
                    });
                    toolbar.innerHTML = pathHtml;
                }
            } else if (item.type === 'link') {
                const url = item.url || '';
                const lowerUrl = url.toLowerCase();
                let contentHtml = '';

                if (lowerUrl.match(/\.(jpeg|jpg|gif|png|webp)([\?#].*)?$/i)) {
                    contentHtml = `<div style="background: #111; padding: 10px; display: flex; justify-content: center; align-items: center; flex: 1; width: 100%; box-sizing: border-box; overflow: hidden;"><img src="${url}" style="max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid #555;"></div>`;
                } else if (lowerUrl.match(/\.(mp4|webm|ogg)([\?#].*)?$/i)) {
                    contentHtml = `<div style="background: #111; padding: 10px; display: flex; justify-content: center; align-items: center; flex: 1; width: 100%; box-sizing: border-box; overflow: hidden;"><video controls autoplay style="max-width: 100%; max-height: 100%; object-fit: contain;"><source src="${url}" type="video/mp4"></video></div>`;
                } else if (lowerUrl.includes('youtube.com/watch') || lowerUrl.includes('youtu.be/')) {
                    let videoId = '';
                    if(url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                    else if (url.includes('v=')) videoId = new URL(url).searchParams.get('v');
                    contentHtml = `<div style="background: #111; padding: 10px; display: flex; justify-content: center; align-items: center; flex: 1; width: 100%; box-sizing: border-box;"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
                } else {
                    contentHtml = `<div style="display: flex; flex-direction: column; flex: 1; height: 100%; background: #fff;"><div style="padding: 8px; background: #dfdfdf; border-bottom: inset 2px; text-align: center; font-size: 13px;"><a href="${url}" target="_blank" style="color: blue;"><b>🌍 ဤနေရာကိုနှိပ်၍ Browser ဖြင့်ဖွင့်ပါ</b></a></div><iframe src="${url}" style="width: 100%; flex: 1; border: none;"></iframe></div>`;
                }
                contentArea.innerHTML = contentHtml;
            }
        }

        function jumpToHistory(winId, index) {
            const winNode = document.getElementById(winId);
            if (winNode && winNode.folderHistory) {
                winNode.folderHistory = winNode.folderHistory.slice(0, index + 1);
                renderWindowContent(winId, winNode.folderHistory[index]);
            }
        }

        function renderFolderItems(itemsArray, container, winId) {
            container.innerHTML = ''; 
            (itemsArray || []).forEach(item => {
                const div = document.createElement('div');
                div.className = 'folder-icon'; // Desktop နဲ့ မရောစေရန် သီးသန့် Class သုံးထားသည်
                div.innerHTML = `<span class="icon-img">${item.icon}</span><span class="icon-title">${item.title}</span>`;
                
                div.ondblclick = () => handleFolderItemClick(item, winId);
                let lastTap = 0;
                div.addEventListener('touchend', (e) => {
                    const ct = new Date().getTime();
                    if (ct - lastTap < 500 && ct - lastTap > 0) { handleFolderItemClick(item, winId); e.preventDefault(); }
                    lastTap = ct;
                });
                container.appendChild(div);
            });
        }

        function handleFolderItemClick(item, winId) {
            if(item.type === 'folder') {
                const winNode = document.getElementById(winId);
                winNode.folderHistory.push(item);
                renderWindowContent(winId, item);
            } else {
                openItem(item);
            }
        }

        function focusWindow(winId) {
            const win = document.getElementById(winId);
            if(win) {
                win.style.display = 'flex';
                win.style.zIndex = ++globalZIndex;
            }
            document.querySelectorAll('.taskbar-item').forEach(tb => tb.classList.remove('active'));
            const tbItem = document.getElementById(`tb_${winId}`);
            if(tbItem) tbItem.classList.add('active');
        }

        function minimizeWindow(winId) {
            const win = document.getElementById(winId);
            if(win) win.style.display = 'none';
            const tbItem = document.getElementById(`tb_${winId}`);
            if(tbItem) tbItem.classList.remove('active');
        }

        function maximizeWindow(winId) {
            const win = document.getElementById(winId);
            if(!win) return;
            if(win.classList.contains('maximized')) {
                win.classList.remove('maximized'); 
            } else {
                win.classList.add('maximized'); 
            }
            focusWindow(winId);
        }

        function toggleWindow(winId) {
            const win = document.getElementById(winId);
            if(!win) return;
            if(win.style.display === 'none') {
                win.style.display = 'flex';
                focusWindow(winId);
            } else {
                if (win.style.zIndex == globalZIndex) {
                    minimizeWindow(winId);
                } else {
                    focusWindow(winId);
                }
            }
        }

        function closeWindow(winId) { 
            const win = document.getElementById(winId);
            if(win) win.remove();
            const tbItem = document.getElementById(`tb_${winId}`);
            if(tbItem) tbItem.remove();
        }

        async function sendMsg(winId) {
            const btn = document.getElementById(`sBtn_${winId}`);
            const msg = document.getElementById(`sMsg_${winId}`).value;
            if(!msg.trim()) return customAlert("Please write a message before sending.", "Error");
            
            btn.innerText = "Sending..."; btn.disabled = true;
            try {
                const res = await fetch('/api/send', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: document.getElementById(`sName_${winId}`).value, 
                        contact: document.getElementById(`sContact_${winId}`).value, 
                        message: msg 
                    })
                });
                if(res.ok) {
                    document.getElementById(`sStatus_${winId}`).style.display = 'block';
                    document.getElementById(`sMsg_${winId}`).value = '';
                    setTimeout(() => {
                        const statusEl = document.getElementById(`sStatus_${winId}`);
                        if(statusEl) statusEl.style.display = 'none';
                    }, 3000);
                } else customAlert("Failed to send.", "Error");
            } catch(e) { customAlert("Network error.", "Error"); }
            if(btn) { btn.innerText = "Send Message"; btn.disabled = false; }
        }

        function dragElement(elmnt, header) {
            let p1=0, p2=0, p3=0, p4=0;
            header.onmousedown = dragStart; header.ontouchstart = dragStart;

            function dragStart(e) {
                if (window.innerWidth <= 500) return; 
                if (elmnt.classList.contains('maximized')) return;
                focusWindow(elmnt.id);
                if(e.type === "touchstart") { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; } 
                else { p3 = e.clientX; p4 = e.clientY; e.preventDefault(); }
                document.onmouseup = dragEnd; document.onmousemove = dragMove;
                document.ontouchend = dragEnd; document.ontouchmove = dragMove;
            }
            function dragMove(e) {
                if(e.type === "touchmove") {
                    p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY;
                    p3 = e.touches[0].clientX; p4 = e.touches[0].clientY;
                } else {
                    e.preventDefault();
                    p1 = p3 - e.clientX; p2 = p4 - e.clientY; p3 = e.clientX; p4 = e.clientY;
                }
                elmnt.style.top = (elmnt.offsetTop - p2) + "px"; elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
            }
            function dragEnd() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
        }

        function makeResizable(win) {
            const edges = ['r', 'b', 'br', 'l', 't', 'tr', 'bl', 'tl'];
            edges.forEach(e => {
                const resizer = document.createElement('div');
                resizer.className = `resizer resizer-${e}`;
                win.appendChild(resizer);
                resizer.addEventListener('mousedown', initResize, false);
                resizer.addEventListener('touchstart', initResize, false);
            });

            let startX, startY, startW, startH, startL, startT;
            let activeEdge = '';

            function initResize(e) {
                e.stopPropagation();
                if(e.cancelable) e.preventDefault();
                focusWindow(win.id);
                activeEdge = e.target.className.split('resizer-')[1];
                startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                startW = parseInt(document.defaultView.getComputedStyle(win).width, 10);
                startH = parseInt(document.defaultView.getComputedStyle(win).height, 10);
                startL = win.offsetLeft;
                startT = win.offsetTop;
                document.documentElement.addEventListener('mousemove', doResize, false);
                document.documentElement.addEventListener('touchmove', doResize, {passive: false});
                document.documentElement.addEventListener('mouseup', stopResize, false);
                document.documentElement.addEventListener('touchend', stopResize, false);
            }

            function doResize(e) {
                if(e.cancelable) e.preventDefault();
                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                let dx = clientX - startX;
                let dy = clientY - startY;

                if (activeEdge.includes('r')) win.style.width = (startW + dx) + 'px';
                if (activeEdge.includes('b')) win.style.height = (startH + dy) + 'px';
                if (activeEdge.includes('l')) { win.style.width = (startW - dx) + 'px'; win.style.left = (startL + dx) + 'px'; }
                if (activeEdge.includes('t')) { win.style.height = (startH - dy) + 'px'; win.style.top = (startT + dy) + 'px'; }
            }

            function stopResize() {
                document.documentElement.removeEventListener('mousemove', doResize, false);
                document.documentElement.removeEventListener('mouseup', stopResize, false);
                document.documentElement.removeEventListener('touchmove', doResize);
                document.documentElement.removeEventListener('touchend', stopResize, false);
            }
        }

        loadDesktop();
    </script>
</body>
</html>
